server.port=8080
spring.application.name=payflow

# Actuator: keep it minimal; ALB health checks hit our own /health endpoint.
management.endpoints.web.exposure.include=health,info

# Structured-ish single-line logs so CloudWatch Logs Insights queries stay simple.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n
