name: payflow

on:
  push:
    branches: [main]
    paths:
      - "payflow/**"
      - ".github/workflows/payflow.yml"

permissions:
  id-token: write # required for OIDC federation - no long-lived AWS keys
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: triage/payflow
  ECS_CLUSTER: triage-cluster
  ECS_SERVICE: payflow

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test
        working-directory: payflow
        run: mvn -q -B test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: payflow
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          docker buildx build --platform linux/amd64 -t "$IMAGE" -t "$REGISTRY/${{ env.ECR_REPOSITORY }}:latest" --push .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}"
